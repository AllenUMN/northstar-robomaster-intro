name: Northstar RoboMaster Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Checkout the repository and all submodules
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pipenv'

      # 3. Install ARM GCC Toolchain (Matches your required downloads)
      - name: Install ARM Toolchain
        uses: ryanwinter/arm-none-eabi-gcc@master
        with:
          release: '10.3-2021.10'

      # 4. Install supporting build tools via Chocolatey
      - name: Install OpenOCD and MinGW
        run: |
          choco install openocd --version 0.11.0 -y
          choco install mingw -y

      # 5. Install Pipenv & Project Dependencies
      # Runs specifically in the northstar-robomaster-project folder
      - name: Install Pipenv and project dependencies
        working-directory: ./northstar-robomaster-project
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          # Force pipenv to use Python 3.11 specifically
          pipenv install --python 3.11

      # 6. Run SCons Build
      # Runs specifically in the northstar-robomaster-project folder
      - name: Build with SCons Standard
        working-directory: ./northstar-robomaster-project
        run: |
          pipenv run scons build profile=debug profiling=true robot=STANDARD

      # 7. Build GoogleTest for the hosted (unit test) build.
      # Taproot links the tests against a system-wide gtest/gmock, and windows-latest has
      # neither, so build them with the same MinGW g++ SCons is about to use. This must run
      # AFTER the hardware build: it exports gcc search-path variables that only the hosted
      # build should see.
      - name: Build GoogleTest
        shell: bash
        # cygpath, because RUNNER_TEMP is a native Windows path and this step is Git Bash.
        run: GTEST_ENV_FILE="$GITHUB_ENV" bash scripts/install_gtest.sh "$(cygpath "$RUNNER_TEMP")/gtest"

      # 8. Build the unit tests
      # These are expected to fail until the exercise TODOs are done, so CI only
      # checks that they COMPILE. Run them yourself with `scons run-tests`.
      - name: Build unit tests
        working-directory: ./northstar-robomaster-project
        run: |
          pipenv run scons build-tests profile=fast robot=STANDARD
